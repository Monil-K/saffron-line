<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saffron Line — Night Kitchen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23241a15'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23f2c979'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0e0b0a;
    font-family: "Trebuchet MS", "Gill Sans", system-ui, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 50% 30%, #241a15 0%, #120d0b 62%, #080606 100%);
  }
  #game {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
    cursor: crosshair;
    touch-action: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="800"
    aria-label="Saffron Line: a night kitchen cooking game. Gather, chop, cook and plate dishes for the orders on the rail."></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
